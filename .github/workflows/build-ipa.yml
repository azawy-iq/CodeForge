name: Build iOS App (.ipa)

# يشتغل هذا تلقائياً عند رفع تحديث لفرع main، أو يدوياً من تبويب Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15   # سيرفر ماك أحدث، فيه نسخ Xcode أحدث تدعم صيغة مشاريع XcodeGen الحديثة

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen (يولّد ملف مشروع Xcode تلقائياً - بدون فتح Xcode أبداً)
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build unsigned for device (بدون توقيع - AltStore يوقّعه وقت التثبيت)
        run: |
          xcodebuild -project CodeForge.xcodeproj \
            -scheme CodeForge \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app into .ipa (بدون توقيع)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CodeForge.app Payload/
          zip -r CodeForge-unsigned.ipa Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-unsigned-ipa
          path: CodeForge-unsigned.ipa

      # --------------------------------------------------------------
      # الخطوات التالية بديل احترافي (موقّع رسمياً) لو حصلت على حساب
      # Apple Developer لاحقاً — معطّلة حالياً (if: false)
      # --------------------------------------------------------------

      - name: Archive & Export IPA (موقّع رسمياً - يتطلب حساب Apple Developer)
        if: false   # عطّل هذي الخطوة حتى تجهز شهادات التوقيع، ثم احذف "if: false"
        run: |
          xcodebuild -project CodeForge.xcodeproj \
            -scheme CodeForge \
            -configuration Release \
            -archivePath $PWD/build/CodeForge.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath $PWD/build/CodeForge.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ExportOptions.plist
