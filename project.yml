name: CodeForge
options:
  bundleIdPrefix: com.codeforge.app
  deploymentTarget:
    iOS: "16.0"

targets:
  CodeForge:
    type: application
    platform: iOS
    sources:
      - path: CodeForge
    info:
      path: CodeForge/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeforge.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
